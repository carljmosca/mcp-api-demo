# HTTP configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Database configuration
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.username=quarkus
# quarkus.datasource.password=quarkus
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mcp_api_demo

# Hibernate configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# MCP Server configuration
# quarkus.mcp.server.enabled=true
# quarkus.mcp.server.name=Ticket API MCP Server
# quarkus.mcp.server.version=1.0.0
# quarkus.mcp.server.path=/mcp

# Server-side resilience for problematic MCP clients
quarkus.http.idle-timeout=30s
quarkus.http.read-timeout=15s
# quarkus.http.keep-alive=true

