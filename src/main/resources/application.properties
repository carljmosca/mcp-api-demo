# HTTP configuration
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Database configuration
# Option A: Use explicit database (requires postgres running on localhost:5432)
# %dev.quarkus.datasource.db-kind=postgresql
# %dev.quarkus.datasource.username=quarkus
# %dev.quarkus.datasource.password=quarkus
# %dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mcp_api_demo

# Option B: Use Quarkus Dev Services (auto-starts postgres in Docker)
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.devservices.enabled=true

# Hibernate configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# MCP Server configuration
%dev.quarkus.mcp.server.enabled=true
%dev.quarkus.mcp.server.name=Ticket API MCP Server
%dev.quarkus.mcp.server.version=1.0.0
%dev.quarkus.mcp.server.path=/mcp

# Server-side resilience for problematic MCP clients
quarkus.http.idle-timeout=30s
quarkus.http.read-timeout=15s
# quarkus.http.keep-alive=true

# Development configuration
# %dev.quarkus.hibernate-orm.log.sql=true
# %dev.quarkus.log.category."org.sebi".level=DEBUG
# %dev.quarkus.log.category."org.postgresql".level=DEBUG
# %dev.quarkus.log.category."io.agroal".level=DEBUG
