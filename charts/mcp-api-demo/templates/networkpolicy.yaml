{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-api-demo.fullname" . }}-postgres
  labels:
    {{- include "mcp-api-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcp-api-demo.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.networkPolicy.postgres.allowFromAppOnly }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "mcp-api-demo.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.postgres.service.port }}
          protocol: TCP
    {{- else }}
    - {}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-api-demo.fullname" . }}-app
  labels:
    {{- include "mcp-api-demo.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-api-demo.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - {}
{{- end }}
