{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcp-api-demo.fullname" . }}-postgres
  labels:
    {{- include "mcp-api-demo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.service.port }}
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "mcp-api-demo.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mcp-api-demo.fullname" . }}-postgres
  labels:
    {{- include "mcp-api-demo.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mcp-api-demo.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcp-api-demo.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mcp-api-demo.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- if .Values.postgres.podSecurityContext }}
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
        {{- end }}
      containers:
        - name: postgres
          securityContext:
            {{- if .Values.postgres.containerSecurityContext }}
            {{- toYaml .Values.postgres.containerSecurityContext | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.securityContext.container | nindent 12 }}
            {{- end }}
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.postgres.service.port }}
              name: postgres
          env:
            - name: PGDATA
              value: {{ .Values.postgres.pgdata | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-api-demo.fullname" . }}-postgres
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcp-api-demo.fullname" . }}-postgres
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        {{- if not .Values.postgres.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: {{ toYaml .Values.postgres.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
        {{- end }}
  {{- end }}
{{- end }}