image:
  repository: ghcr.io/carljmosca/mcp-api-demo
  tag: "main-37c49ce"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: tailscale
  annotations: {}
  hosts:
    - host: null
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  # Additional environment variables for the app
  # QUARKUS_LOG_LEVEL: DEBUG
  # CUSTOM_VAR: value
  {}

probes:
  liveness:
    path: "/q/openapi"  # set to /q/health/live if quarkus-smallrye-health is enabled
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: "/q/openapi"  # set to /q/health/ready if quarkus-smallrye-health is enabled
    initialDelaySeconds: 10
    periodSeconds: 5

mcp:
  enabled: true
  name: "Ticket API MCP Server"
  version: "1.0.0"
  path: "/mcp"

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  # Use a subdirectory for PGDATA so the container can create and own it (better for non-root)
  pgdata: "/var/lib/postgresql/data/pgdata"
  podSecurityContext:
    # The official postgres:alpine image uses uid/gid 70 for the 'postgres' user
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsUser: 70
    runAsGroup: 70
  auth:
    username: app
    password: app
    database: app
  service:
    port: 5432
  persistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

quarkus:
  http:
    port: 8080
  datasource:
    dbKind: postgresql
    # Set via env, derived from postgres service
  hibernate:
    database:
      generation: drop-and-create
    import:
      files: import.sql
      enabled: true

securityContext:
  pod:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

pdb:
  app:
    enabled: true
    maxUnavailable: 1
  postgres:
    enabled: true
    maxUnavailable: 0

networkPolicy:
  enabled: true
  # Allow app to call Postgres only; allow ingress to app from anywhere (typical Ingress controller path)
  app:
    allowFromNamespaces: []  # e.g., ["ingress-nginx"] if you want to lock further
  postgres:
    allowFromAppOnly: true